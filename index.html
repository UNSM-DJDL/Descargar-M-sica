<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargador MP3 YouTube Directo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); 
            min-height: 100vh; padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { text-align: center; color: white; margin-bottom: 25px; }
        .header h1 { font-size: 2.2em; margin-bottom: 5px; }
        .main-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .panel { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        h2 { font-size: 1.1em; margin-bottom: 15px; border-bottom: 2px solid #2a5298; padding-bottom: 8px; color: #1e3c72; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-weight: 600; font-size: 0.85em; margin-bottom: 4px; color: #333; }
        input[type="text"] { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 0.9em; }
        input[type="text"]:focus { outline: none; border-color: #2a5298; }
        .estado { font-size: 0.9em; text-align: center; padding: 10px; border-radius: 6px; background: #e3f2fd; color: #1565c0; margin: 12px 0; min-height: 42px; display: flex; align-items: center; justify-content: center; }
        .estado.exito { background: #c8e6c9; color: #2e7d32; }
        .estado.error { background: #ffcdd2; color: #c62828; }
        .estado.procesando { background: #e8eaf6; color: #283593; }
        .btn { display: block; width: 100%; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 8px; font-size: 0.95em; text-align: center; }
        .btn-primary { background: #1e3c72; }
        .btn-primary:hover { background: #2a5298; }
        .btn-dl { background: #00b894; display: none; }
        .btn-dl:hover { background: #00a884; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .badge { background: #e8f5e9; color: #2e7d32; font-size: 0.8em; padding: 6px 10px; border-radius: 4px; border: 1px solid #a5d6a7; margin-bottom: 12px; display: block; text-align: center; }
        .thumb-img { width: 100%; border-radius: 6px; margin-bottom: 10px; border: 1px solid #ddd; }
        .info-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; font-size: 0.85em; }
        .info-lbl { font-weight: 600; color: #1e3c72; }
        .info-val { color: #555; text-align: right; max-width: 60%; word-break: break-word; }
        .preview-wrap { display: none; }
        .preview-wrap.activo { display: block; }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.1); border-top-color: #1e3c72; border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (max-width: 800px) { .main-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎵 Descargador MP3 en la misma Pestaña</h1>
    </div>

    <div class="main-container">
        <!-- PANEL IZQUIERDO -->
        <div class="panel">
            <h2>📥 Cargar y Convertir</h2>

            <div class="input-group">
                <label>URL de YouTube:</label>
                <input type="text" id="urlVideo" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
            </div>

            <button class="btn btn-primary" id="btnCargar" onclick="cargarVideo()">🔍 Cargar Video</button>

            <span class="badge">🔊 Calidad Audio: 192-320 kbps (Nativa YouTube)</span>

            <div class="estado" id="estado">
                ✓ Ingresa un enlace para comenzar.
            </div>

            <button id="btnDescarga" class="btn btn-dl" onclick="ejecutarDescargaBlob()">
                ⬇️ DESCARGAR MP3 AQUÍ
            </button>
        </div>

        <!-- PANEL DERECHO -->
        <div class="panel">
            <h2>🎧 Vista Previa</h2>

            <div class="preview-wrap" id="previewWrap">
                <img id="thumb" class="thumb-img" alt="Miniatura" src="">

                <div class="info-row">
                    <span class="info-lbl">Título:</span>
                    <span class="info-val" id="infoTitulo">-</span>
                </div>
                <div class="info-row">
                    <span class="info-lbl">Canal:</span>
                    <span class="info-val" id="infoCanal">-</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    var vidId = null;
    var tituloGlobal = 'musica';

    function extraerId(url) {
        try {
            var cleanUrl = url.split('&')[0];
            if (cleanUrl.includes('youtube.com/watch')) return new URL(cleanUrl).searchParams.get('v');
            if (cleanUrl.includes('youtu.be/')) return cleanUrl.split('youtu.be/')[1].split(/[?#]/)[0];
            if (cleanUrl.includes('youtube.com/embed/')) return cleanUrl.split('embed/')[1].split('?')[0];
        } catch(e) {}
        return null;
    }

    function setEstado(msg, tipo) {
        var el = document.getElementById('estado');
        el.className = 'estado' + (tipo ? ' ' + tipo : '');
        el.innerHTML = msg;
    }

    document.getElementById('urlVideo').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') cargarVideo();
    });

    async function cargarVideo() {
        var url = document.getElementById('urlVideo').value.trim();
        var btnDL = document.getElementById('btnDescarga');
        btnDL.style.display = 'none';

        if (!url) {
            setEstado('❌ Ingresa una URL de YouTube.', 'error');
            return;
        }
        var id = extraerId(url);
        if (!id) {
            setEstado('❌ URL no válida.', 'error');
            return;
        }
        vidId = id;

        setEstado('<span class="spinner"></span>Obteniendo datos del video...', 'procesando');

        document.getElementById('thumb').src = 'https://img.youtube.com/vi/' + id + '/hqdefault.jpg';

        try {
            var resp = await fetch('https://noembed.com/embed?url=https://www.youtube.com/watch?v=' + id);
            var d = await resp.json();
            tituloGlobal = d.title || 'musica_youtube';
            document.getElementById('infoTitulo').innerText = tituloGlobal;
            document.getElementById('infoCanal').innerText = d.author_name || 'Desconocido';
        } catch(e) {
            tituloGlobal = 'musica_youtube';
        }

        document.getElementById('previewWrap').classList.add('activo');
        btnDL.style.display = 'block';
        setEstado('✅ Listo. Haz clic en el botón verde para guardar el archivo.', 'exito');
    }

    async function ejecutarDescargaBlob() {
        if (!vidId) return;

        var btnDL = document.getElementById('btnDescarga');
        var btnCargar = document.getElementById('btnCargar');
        
        btnDL.disabled = true;
        btnCargar.disabled = true;
        setEstado('<span class="spinner"></span>Procesando y guardando audio en disco...', 'procesando');

        try {
            // Se utiliza un proxy directo que devuelve el flujo de bytes de audio directamente
            var streamUrl = 'https://api.vevioz.com/api/button/mp3/' + vidId;
            
            // Creamos una descarga mediante un iframe temporal silencioso dentro de la misma página
            var frame = document.getElementById('hiddenDownloader');
            if (!frame) {
                frame = document.createElement('iframe');
                frame.id = 'hiddenDownloader';
                frame.style.display = 'none';
                document.body.appendChild(frame);
            }
            
            // Forzar navegación del frame interno sin redireccionar la pestaña principal
            frame.src = streamUrl;

            setEstado('✅ ¡Descarga iniciada! Revisa tu carpeta de descargas.', 'exito');
        } catch (err) {
            setEstado('❌ Error al procesar la descarga.', 'error');
        } finally {
            setTimeout(function() {
                btnDL.disabled = false;
                btnCargar.disabled = false;
            }, 3000);
        }
    }
</script>
</body>
</html>
