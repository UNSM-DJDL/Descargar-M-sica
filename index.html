<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estación de Carga Retro - VINTAGE BLUE</title>
    <style>
        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }

        body { 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #050b14; 
            margin: 0; 
            padding: 20px; 
            color: #00ffff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 95vh;
            text-shadow: 0 0 6px rgba(0, 255, 255, 0.6);
            animation: flicker 0.2s infinite;
        }

        .crt-monitor { 
            background: #020710; 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: inset 0 0 50px rgba(0,0,0,1), 0 0 25px rgba(0,255,255,0.2); 
            max-width: 580px; 
            width: 100%; 
            border: 4px solid #0a2540; 
            text-align: left;
        }

        h2 { 
            color: #00ffff; 
            font-size: 1.3em; 
            margin-top: 0; 
            text-align: center; 
            font-weight: bold; 
            letter-spacing: 2px;
        }

        .linea-decorativa { 
            color: #0a2540; 
            margin: 10px 0; 
            font-weight: bold; 
            letter-spacing: -1px;
        }

        .input-group { margin: 25px 0; }
        .input-group label { display: block; font-weight: bold; font-size: 0.85em; margin-bottom: 10px; color: #00ffff; }
        
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            box-sizing: border-box; 
            border: 2px solid #0a2540; 
            background: #010308; 
            color: #00ffff; 
            font-size: 0.95em; 
            font-family: 'Courier New', Courier, monospace; 
            outline: none;
        }
        input[type="text"]:focus { border-color: #00ffff; box-shadow: 0 0 8px rgba(0,255,255,0.5); }

        .btn-vintage { 
            display: block; 
            width: 100%; 
            background-color: #010308; 
            color: #00ffff; 
            text-align: center; 
            padding: 12px; 
            border: 2px solid #00ffff; 
            font-size: 1em; 
            font-weight: bold; 
            cursor: pointer; 
            font-family: 'Courier New', Courier, monospace; 
            text-transform: uppercase; 
            margin-top: 15px;
            box-shadow: 0 0 5px rgba(0,255,255,0.3);
        }
        .btn-vintage:hover { background-color: #0a2540; color: #fff; }
        
        .preview-container { 
            display: none; 
            margin: 25px 0; 
            text-align: center; 
            border: 2px dashed #0a2540; 
            padding: 15px; 
            background: #01050f; 
        }
        .preview-img { 
            max-width: 100%; 
            height: auto; 
            border: 2px solid #00ffff; 
            margin-bottom: 15px; 
            max-height: 180px; 
            box-shadow: 0 0 10px rgba(0,255,255,0.3);
        }
        
        .action-buttons { display: none; gap: 15px; margin-top: 10px; }
        .btn-download { 
            flex: 1; 
            padding: 12px; 
            background: #010308; 
            border: 2px solid #00ffff; 
            color: #00ffff; 
            font-family: 'Courier New', Courier, monospace; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase; 
            text-align: center; 
            font-size: 0.9em;
        }
        .btn-download:hover { background: #00ffff; color: #000; text-shadow: none; }
        
        /* Contenedor seguro para la consola interna de descarga */
        .terminal-box {
            display: none;
            margin-top: 20px;
            width: 100%;
            height: 180px;
            border: 2px solid #0a2540;
            background-color: #000;
        }
        .terminal-box iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .estado-consola { font-size: 0.9em; color: #00ffff; margin-top: 15px; min-height: 20px; word-wrap: break-word; }
    </style>
</head>
<body>
<div class="main-container">
    <div class="crt-monitor">
        <div class="linea-decorativa">____________________________________________________</div>
        <h2>CYAN MULTIMEDIA TERMINAL // VINTAGE-198X</h2>
        <div class="linea-decorativa">____________________________________________________</div>
        
        <div class="input-group">
            <label>[DRIVE_A] ENTER TARGET YOUTUBE URL:</label>
            <input type="text" id="url-enlace" placeholder="LOG_IN URL..." autocomplete="off">
        </div>

        <button class="btn-vintage" id="btn-action" onclick="cargarVideoPrevia()">LOAD DATA_VIDEO</button>
        
        <div class="preview-container" id="preview-box">
            <div style="font-size: 0.8em; margin-bottom: 10px; text-align: left;">[TRACK_INFO] VISUAL IM_IMAGE CONFIRMED:</div>
            <img src="" id="video-thumb" class="preview-img" alt="Previa Analógica">
            
            <div class="action-buttons" id="download-box">
                <button class="btn-download" onclick="abrirConsolaDescarga('mp3')">>> EXTRACT MP3</button>
                <button class="btn-download" onclick="abrirConsolaDescarga('mp4')">>> EXTRACT MP4</button>
            </div>

            <!-- ✅ Sub-pantalla interna que encapsula el convertidor -->
            <div class="terminal-box" id="monitor-interno">
                <iframe src="" id="servidor-frame"></iframe>
            </div>
        </div>

        <div class="linea-decorativa">.</div>
        <div class="estado-consola" id="mensaje-estado">READY FOR DATA INPUT. PORT_OPEN.</div>
        <div class="linea-decorativa">____________________________________________________</div>
    </div>
</div>
<script>
    document.getElementById('url-enlace').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') { cargarVideoPrevia(); }
    });

    let currentVideoId = "";

    function extraerIdVideo(url) {
        try {
            if (url.includes('watch?v=')) {
                var urlObj = new URL(url);
                return urlObj.searchParams.get('v');
            }
            if (url.includes('youtu.be/')) {
                var partes = url.split('youtu.be/');
                if (partes) {
                    return partes[1].split(/[?#&]/)[0];
                }
            }
            return null;
        } catch (e) {
            return null;
        }
    }

    function cargarVideoPrevia() {
        var urlInput = document.getElementById('url-enlace').value.trim();
        var txtEstado = document.getElementById('mensaje-estado');
        var previewBox = document.getElementById('preview-box');
        var downloadBox = document.getElementById('download-box');
        var thumbImg = document.getElementById('video-thumb');
        var monitorInterno = document.getElementById('monitor-interno');

        if (!urlInput) {
            txtEstado.innerText = "[SYS_ERR] INPUT NULL. RE-ENTER REQUEST.";
            previewBox.style.display = "none";
            return;
        }

        currentVideoId = extraerIdVideo(urlInput);

        if (!currentVideoId || currentVideoId.length !== 11) {
            txtEstado.innerText = "[SYS_ERR] GEOMETRY INDEX ERROR. INVALID YOUTUBE ID.";
            previewBox.style.display = "none";
            return;
        }

        txtEstado.innerText = "[LOAD] DECODING BITSTREAM METADATA... UPDATING CY_MONITOR MATRIX.";

        var baseImagen = atob('aHR0cHM6Ly9pLnl0aW1nLmNvbS92aS8=');
        thumbImg.src = baseImagen + currentVideoId + '/mqdefault.jpg';
        
        // Ocultar sub-pantalla antigua de descargas previas al cargar nuevo video
        monitorInterno.style.display = "none";
        document.getElementById('servidor-frame').src = "";

        previewBox.style.display = "block";
        downloadBox.style.display = "flex";
        txtEstado.innerText = "[SUCCESS] AUDIO/VIDEO STREAM DETECTED. SELECT EXTRCTION FORMAT.";
    }

    // Despliega de forma limpia el convertidor dentro del monitor CRT azul
    function abrirConsolaDescarga(formato) {
        var txtEstado = document.getElementById('mensaje-estado');
        var monitorInterno = document.getElementById('monitor-interno');
        var frame = document.getElementById('servidor-frame');
        
        if (!currentVideoId) return;

        txtEstado.innerText = "[PROCESS] MOUNTING HOST SERVER INSIDE MATRIX CLIENT...";

        // Usamos una pasarela de alta compatibilidad para inyección embebida
        let servidorEndpoint = "";
        if (formato === 'mp3') {
            servidorEndpoint = atob('aHR0cHM6Ly9waC55MndwLmNvbS9hcGkvYnV0dG9uL21wMy8=') + currentVideoId;
        } else {
            servidorEndpoint = atob('aHR0cHM6Ly9waC55MndwLmNvbS9hcGkvYnV0dG9uL3ZpZGVvLzM2MC8=') + currentVideoId;
        }

        // Cargar el convertidor en el cuadro interno y hacerlo visible
        frame.src = servidorEndpoint;
        monitorInterno.style.display = "block";

        setTimeout(function() {
            txtEstado.innerText = "[READY] CLICK THE DOWNLOAD BUTTON INSIDE THE BLACK BOX TO RECEIVE THE FILE.";
        }, 1500);
    }
</script>
</body>
</html>
